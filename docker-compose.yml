services:
  web:
    build: .
    command: >
      sh -c "python manage.py migrate &&
             python manage.py runserver 0.0.0.0:8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      DJANGO_ALLOWED_HOSTS: "127.0.0.1,localhost,testserver"
      DJANGO_DEBUG: "1"
      SQLITE_PATH: "/app/data/db.sqlite3"
    volumes:
      - ./docker-data:/app/data
      - ./media:/app/media
